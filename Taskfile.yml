# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  generate: ## Команда для генерации из proto файлов
    cmds:
      - protoc -I proto proto/sso/*.proto --go_out=./gen/go/ --go_opt=paths=source_relative --go-grpc_out=./gen/go/
    aliases:
      - gen
    desc: "Generate code from proto files"